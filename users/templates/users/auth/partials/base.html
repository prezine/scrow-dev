{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Scrow — {% block page_title %}{% endblock %}</title>
    <meta charset="utf-8">
    <meta content="ie=edge" http-equiv="x-ua-compatible">
    <meta content="Scrow, Escrow, Circlepanda, Circlepanda Escrow, Protect your transaction, anonymouse transaction, trade with trust, best escrow service, #1 Escrow company in Africa, Africa, Trade, Trust, Transactions, Business, Buy, Sell, Market, Payment, Platform"
          name="keywords">
    <meta content="Circlepanda Inc" name="author">
    <meta content="Scrow description" name="description">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta name="HandheldFriendly" content="True">
    <meta name="author" content="Circlepanda">
    <meta name="robot" content="index, follow">
    <meta name="copyright" content="Copyright © {% now "Y" %} Scrow. All Rights Reserved.">
    <meta name="language" content="English">
    <meta name="revisit-after" content="1 days">
    <link href="{% static 'favicon.png' %}" rel="shortcut icon">
    <link href="{% static 'favicon.png' %}" rel="apple-touch-icon">
    <link href="http://fast.fonts.net/cssapi/487b73f1-c2d1-43db-8526-db577e4c822b.css" rel="stylesheet" type="text/css">
    <link href="{% static 'bower_components/select2/dist/css/select2.min.css' %}" rel="stylesheet">
    <link href="{% static 'bower_components/bootstrap-daterangepicker/daterangepicker.css' %}" rel="stylesheet">
    <link href="{% static 'bower_components/dropzone/dist/dropzone.css' %}" rel="stylesheet">
    <link href="{% static 'bower_components/datatables.net-bs/css/dataTables.bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'bower_components/fullcalendar/dist/fullcalendar.min.css' %}" rel="stylesheet">
    <link href="{% static 'bower_components/perfect-scrollbar/css/perfect-scrollbar.min.css' %}" rel="stylesheet">
    <link href="{% static 'bower_components/slick-carousel/slick/slick.css' %}" rel="stylesheet">
    <link href="{% static 'icon_fonts_assets/entypo/style.css' %}" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    {% block suffix_headtags %}{% endblock %}
</head>
<body class="auth-wrapper">
<div class="all-wrapper menu-side with-pattern" id="app">
    <status-msg></status-msg>
    {% block content %}{% endblock %}
</div>
<script src="{% static 'bower_components/jquery/dist/jquery.min.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
<script>
    (function (i, s, o, g, r, a, m) {
        i['GoogleAnalyticsObject'] = r;
        i[r] = i[r] || function () {
            (i[r].q = i[r].q || []).push(arguments)
        }, i[r].l = 1 * new Date();
        a = s.createElement(o),
            m = s.getElementsByTagName(o)[0];
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m)
    })(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga');

    ga('create', 'UA-42863888-9', 'auto');
    ga('send', 'pageview');
</script>
{% block suffix_bottomtags %}{% endblock %}
</body>
</html>
