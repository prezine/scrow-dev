{% extends 'core/partials/base.html' %}
{% load static %}

{% block content %}
    <h1>Dashboard</h1>
    <a href="#" class="btn btn-primary btn-sm btn-fill" onclick="
            event.preventDefault();
            document.getElementById('logout-form').submit();">Logout
    </a>

    <form action="{% url 'logout' %}"
          method="POST"
          style="display: none;" id="logout-form">
        {% csrf_token %}
    </form>
    {% if not user.is_activated %}
        <resend-verification-link></resend-verification-link>
    {% endif %}
{% endblock content %}
