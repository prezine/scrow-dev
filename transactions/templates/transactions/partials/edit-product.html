<div aria-hidden="true" class="modal fade" id="editProductModal-{{ product.id }}" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header faded smaller">
                <div class="modal-title">
                    <span>Edit {{ product.name }}</span>
                </div>
            </div>
            <form action="{% url 'transactions:update_product' product.id %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="form-group">
                        <label for="">Item Name</label>
                        <input class="form-control" name="name" type="text" value="{{ product.name }}" placeholder="Adobe XD">
                    </div>
                    <div class="form-group">
                        <label for="">Description</label>
                        <textarea class="form-control" name="description" rows="3"
                                  placeholder="Adobe XD is a vector-based user experience design tool for web apps and mobile apps, developed and published by Adobe Inc. It is available for macOS and Windows, although there are versions for iOS and Android to help preview the result of work directly on mobile devices. XD.">{{ product.description }}</textarea>
                    </div>
                    <div class="form-group">
                        <label for="">Item Image</label>
                        <input type="file" name="image" value="{{ product.image }}" class="form-control" accept="image/*"/>
                    </div>
                    <div class="form-group">
                        <label for=""> Amount </label>
                        <div>
                            <input class="form-control" name="amount" placeholder="Amount of Item"
                                   type="text" value="{{ product.amount }}">
                        </div>
                    </div>
                    <div class="modal-footer buttons-on-left">
                        <button class="btn btn-teal" type="submit"> Update Product</button>
                        <button class="btn btn-link" data-dismiss="modal" type="button"> Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
